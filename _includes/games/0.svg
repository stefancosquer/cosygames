{% comment %}Same composition as lib/features/home/game_thumbnail.dart; keep in sync.{% endcomment %}
<svg class="game-preview" viewBox="0 0 96 96" aria-hidden="true" focusable="false">
<rect x="0" y="0" width="96" height="96" fill="var(--preview-paper)" shape-rendering="crispEdges"/>
<text x="16" y="16" fill="var(--preview-ink)" font-family="Roboto,Arial,sans-serif" font-weight="500" font-size="19.2" text-anchor="middle" dominant-baseline="central">1</text><text x="48" y="48" fill="var(--preview-ink)" font-family="Roboto,Arial,sans-serif" font-weight="500" font-size="19.2" text-anchor="middle" dominant-baseline="central">5</text><text x="16" y="80" fill="var(--preview-ink)" font-family="Roboto,Arial,sans-serif" font-weight="500" font-size="19.2" text-anchor="middle" dominant-baseline="central">7</text><text x="80" y="80" fill="var(--preview-ink)" font-family="Roboto,Arial,sans-serif" font-weight="500" font-size="19.2" text-anchor="middle" dominant-baseline="central">9</text><rect x="0" y="0" width="96" height="1" fill="var(--preview-ink)" shape-rendering="crispEdges"/>
<rect x="0" y="95" width="96" height="1" fill="var(--preview-ink)" shape-rendering="crispEdges"/>
<rect x="0" y="0" width="1" height="96" fill="var(--preview-ink)" shape-rendering="crispEdges"/>
<rect x="95" y="0" width="1" height="96" fill="var(--preview-ink)" shape-rendering="crispEdges"/>
<rect x="32" y="0" width="1" height="96" fill="var(--preview-ink)" shape-rendering="crispEdges"/>
<rect x="64" y="0" width="1" height="96" fill="var(--preview-ink)" shape-rendering="crispEdges"/>
<rect x="0" y="32" width="96" height="1" fill="var(--preview-ink)" shape-rendering="crispEdges"/>
<rect x="0" y="64" width="96" height="1" fill="var(--preview-ink)" shape-rendering="crispEdges"/>

</svg>
